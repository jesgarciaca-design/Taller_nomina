<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Simulador Nómina</title>

</head>

<body>

    <form>

        <fieldset>

            <legend>Simulador de Nómina</legend>

            <label for="nombre">
                Nombre:
            </label>

            <input
                type="text"
                id="nombre"
            >

            <br><br>

            <label for="edad">
                Edad:
            </label>

            <input
                type="number"
                id="edad"
                min="0"
                max="140"
            >

            <br><br>

            <label for="salario">
                Salario base:
            </label>

            <input
                type="number"
                id="salario"
            >

            <br><br>

            <label for="comisiones">
                Comisiones:
            </label>

            <input
                type="number"
                id="comisiones"
            >

            <br><br>

            <label for="horasExtra">
                Horas extra:
            </label>

            <input
                type="number"
                id="horasExtra"
            >

            <br><br>

            <label for="riesgo">
                Nivel de riesgo ARL:
            </label>

            <select id="riesgo">

                <option value="0.00522">
                    I - Mínimo
                </option>

                <option value="0.01044">
                    II - Bajo
                </option>

                <option value="0.02436">
                    III - Medio
                </option>

                <option value="0.0435">
                    IV - Alto
                </option>

                <option value="0.0696">
                    V - Máximo
                </option>

            </select>

            <br><br>

            <button onclick="calcular()">

                Calcular

            </button>

        </fieldset>

    </form>

</body>

</html>
